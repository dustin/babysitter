name: Haskell CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.3

    - name: Build and test
      run: nix flake check --print-build-logs

    - name: Build executable
      run: |
        nix build --print-build-logs
        install -Dm755 result/bin/babysitter babysitter

    - name: Store Artifact
      uses: actions/upload-artifact@v7
      with:
        name: babysitter
        path: babysitter
